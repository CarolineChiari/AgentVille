# Tests on every push, then the desktop app for macOS (.dmg/.zip, Apple silicon and Intel) and
# Windows (installer and portable .exe). The builds are attached to each run as artifacts; a
# `v*` tag also publishes them as a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # the tests never start Electron
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            targets: --mac --arm64 --x64
          - os: windows-latest
            name: windows
            targets: --win --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # No signing certificate yet: don't go looking for one in the runner's keychain. macOS
      # builds are ad-hoc signed (see package.json), which Apple silicon needs to run them at all.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npx vite build
      - run: npx electron-builder ${{ matrix.targets }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AgentVille-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*-mac.zip
            release/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "AgentVille $GITHUB_REF_NAME" --generate-notes
